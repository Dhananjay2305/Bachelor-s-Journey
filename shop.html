<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop — BachelorHub 🛒</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="nav-logo">
            <span class="nav-logo-icon">🏠</span>
            <span class="nav-logo-text">BachelorHub</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">🏠 Home</a></li>
            <li><a href="recipes.html">🍳 Recipes</a></li>
            <li><a href="budget.html">📊 Budget</a></li>
            <li><a href="shop.html">🛒 Shop</a></li>
            <li><a href="auth.html" id="nav-auth-link">👤 Login</a></li>
        </ul>
        <div style="display:flex;align-items:center;gap:0.75rem;">
            <button class="nav-cart-btn">
                🛒 <span class="cart-count" id="cartCount">0</span>
            </button>
            <button class="mobile-menu-btn">☰</button>
        </div>
    </nav>

    <section class="section">
        <div class="section-header">
            <span class="section-badge badge-green">🛒 Market</span>
            <h2 class="section-title">Live Grocery Store</h2>
            <p class="section-subtitle">Real products fetched from our database. Order persistence enabled.</p>
        </div>

        <div class="shop-top-bar">
            <div class="shop-search">
                <input type="text" id="shopSearch" placeholder="Search tomatoes, rice, milk...">
            </div>
            <div class="shop-category-filters">
                <button class="shop-filter-btn active" onclick="filterShop('all', this)">All</button>
                <button class="shop-filter-btn" onclick="filterShop('vegetables', this)">🥬 Veg</button>
                <button class="shop-filter-btn" onclick="filterShop('fruits', this)">🍎 Fruits</button>
                <button class="shop-filter-btn" onclick="filterShop('dairy', this)">🥛 Dairy</button>
                <button class="shop-filter-btn" onclick="filterShop('staples', this)">🌾 Staples</button>
            </div>
        </div>

        <div class="shop-layout">
            <div class="shop-grid" id="shopGrid">
                <p style="text-align:center; color:var(--text-muted); grid-column:1/-1;">Loading market inventory...</p>
            </div>

            <div class="cart-sidebar">
                <div class="cart-title">🛒 Checkout</div>
                <div class="cart-items" id="cartItems"></div>
                <div class="cart-divider"></div>
                <div class="cart-total-row"><span>Subtotal</span> <span id="cartSubtotal">₹0</span></div>
                <div class="cart-total-row"><span>Delivery</span> <span id="cartDelivery">₹0</span></div>
                <div class="cart-divider"></div>
                <div class="cart-total-row"><span style="font-weight:700">Total</span> <span class="cart-grand-total"
                        id="cartTotal">₹0</span></div>
                <button class="cart-checkout-btn" id="checkoutBtn" onclick="checkout()" disabled>🛍️ Confirm
                    Order</button>
            </div>
        </div>
    </section>

    <script src="js/common.js"></script>
    <script src="js/shop.js"></script>
</body>

</html>
